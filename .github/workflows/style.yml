name: brew style

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  style:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # main
      - name: Run brew style
        run: |
          shopt -s nullglob
          files=(Formula/*.rb Casks/*.rb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No formulae or casks yet."
            exit 0
          fi
          brew style "${files[@]}"
